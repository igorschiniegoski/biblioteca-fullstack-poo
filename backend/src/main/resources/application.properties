spring.application.name=sistema-biblioteca

# Conexão com o MySQL. Os valores podem ser sobrescritos por variáveis de ambiente
# (DB_URL, DB_USER, DB_PASSWORD) para não deixar credenciais reais no repositório.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:biblioteca}
spring.datasource.password=${DB_PASSWORD:biblioteca}

# A estrutura do banco é criada pelo database/schema.sql.
# "validate" faz o Hibernate conferir, na inicialização, se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.origens=http://localhost:5173
